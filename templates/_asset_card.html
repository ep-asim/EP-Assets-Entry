<article class="asset-card"><div class="asset-top"><span class="pill">{{ asset.asset_type }}</span><span class="audience">{{ asset.audience }}</span></div><h3>{{ asset.certification_type }}</h3><dl><dt>Valid from</dt><dd>{{ asset.start_date }}</dd><dt>Expires</dt><dd>{{ asset.expiry_date or 'No expiry date' }}</dd><dt>Location</dt><dd>{{ asset.location or 'Not specified' }}</dd></dl><div class="asset-actions"><a href="{{ url_for('edit_asset', kind='item' if asset.item_number is defined else 'supplier', asset_id=asset.id) }}">Edit</a>{% if asset.link %}<a href="{{ url_for('preview_asset', kind='item' if asset.item_number is defined else 'supplier', asset_id=asset.id) }}" target="_blank" rel="noopener">Preview</a><a href="{{ asset.link }}" target="_blank" rel="noopener">Open link</a>{% endif %}</div></article>
